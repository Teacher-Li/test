<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日出日落时间查询</title>
    <!-- 引入外部资源 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">

    <!-- Tailwind 配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FF7E36', // 日出橙
                        secondary: '#FFB879', // 浅橙色
                        accent: '#FFE0B2', // 极浅橙
                        dark: '#263238', // 深蓝灰
                        light: '#FAFAFA', // 浅灰白
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <!-- 自定义工具类 -->
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }

            .gradient-bg {
                background: linear-gradient(135deg, #FF7E36 0%, #FFB879 100%);
            }

            .card-shadow {
                box-shadow: 0 10px 25px -5px rgba(255, 126, 54, 0.1), 0 8px 10px -6px rgba(255, 126, 54, 0.1);
            }

            .hover-lift {
                transition: transform 0.3s ease, box-shadow 0.3s ease;
            }

                .hover-lift:hover {
                    transform: translateY(-5px);
                    box-shadow: 0 20px 25px -5px rgba(255, 126, 54, 0.15), 0 10px 10px -5px rgba(255, 126, 54, 0.1);
                }

            .animate-fadeIn {
                animation: fadeIn 0.5s ease-in-out;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        }
    </style>
</head>

<body class="flex flex-col bg-gray-50 min-h-screen font-sans text-dark">
    <!-- 顶部导航栏 -->
    <header class="gradient-bg text-white shadow-md">
        <div class="container mx-auto px-4 py-5 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa fa-sun-o text-2xl animate-pulse"></i>
                <h1 class="text-[clamp(1.5rem,3vw,2rem)] font-bold">罗梓菁-Sunshine</h1>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="flex-grow container mx-auto px-4 py-8 md:py-12">
        <!-- 介绍卡片 -->
        <div class="max-w-3xl mx-auto mb-8 bg-white rounded-2xl p-6 card-shadow hover-lift">
            <div class="flex flex-col md:flex-row items-center gap-6">
                <div class="w-full md:w-1/3">
                    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=800&q=80"
                         alt="日出风景图"
                         class="rounded-xl w-full h-auto object-cover shadow-lg">
                </div>
                <div class="w-full md:w-2/3">
                    <h2 class="text-[clamp(1.25rem,2vw,1.75rem)] font-bold text-primary mb-3">查询每日日出日落时间</h2>
                    <p class="text-gray-600 mb-4">罗梓菁将为您提供准确的日出时间信息，让您不错过每一个美丽的清晨。</p>
                    <div class="flex items-center text-sm text-gray-500">
                        <i class="fa fa-lightbulb-o text-secondary mr-2"></i>
                        <span>提示：高纬度地区季节变化对日出时间影响更明显</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 查询表单 -->
        <div class="max-w-2xl mx-auto bg-white rounded-2xl p-6 md:p-8 card-shadow mb-8 hover-lift">
            <h2 class="text-[clamp(1.25rem,2vw,1.5rem)] font-bold text-center mb-6 text-dark">请输入城市和选择日期</h2>

            <form id="sunriseForm" class="space-y-6">
                <!-- 城市输入框 -->
                <div class="space-y-2">
                    <label for="cityInput" class="block text-sm font-medium text-gray-700">城市名称</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa fa-map-marker text-primary"></i>
                        </div>
                        <input type="text"
                               id="cityInput"
                               name="cityInput"
                               placeholder="请输入城市（如：北京、广州）"
                               required
                               class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-300 bg-gray-50">
                    </div>
                </div>

                <!-- 日期选择 -->
                <div class="space-y-2">
                    <label for="date" class="block text-sm font-medium text-gray-700">查询日期</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa fa-calendar text-primary"></i>
                        </div>
                        <input type="date"
                               id="date"
                               name="date"
                               required
                               class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-300 bg-gray-50">
                    </div>
                </div>

                <!-- 提交按钮 -->
                <button type="submit"
                        class="w-full bg-primary hover:bg-primary/90 text-white font-medium py-3 px-4 rounded-lg transition-all duration-300 flex justify-center items-center gap-2">
                    <i class="fa fa-search"></i>
                    <span>查询日出日落时间</span>
                </button>
            </form>
        </div>

        <!-- 结果显示区域 -->
        <div id="resultContainer" class="max-w-2xl mx-auto hidden">
            <!-- 加载中状态 -->
            <div id="loadingIndicator" class="hidden py-12 text-center">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary mb-4"></div>
                <p class="text-gray-600">正在获取城市经纬度与日出数据...</p>
            </div>

            <!-- 成功结果卡片 -->
            <div id="resultCard" class="hidden bg-white rounded-2xl p-6 md:p-8 card-shadow hover-lift">
                <div class="text-center mb-6">
                    <h2 class="text-[clamp(1.25rem,2vw,1.5rem)] font-bold text-dark mb-2">日出日落查询结果</h2>
                    <p id="resultInfo" class="text-gray-500 text-sm"></p>
                </div>

                <div class="flex flex-col md:flex-row items-center justify-around py-6 gap-8">
                    <!-- 日出信息 -->
                    <div class="text-center">
                        <div class="text-5xl text-primary mb-3 animate-pulse">
                            <i class="fa fa-sun-o"></i>
                        </div>
                        <p class="text-lg font-semibold text-gray-700 mb-1">日出时间</p>
                        <p id="sunriseTime" class="text-2xl font-bold text-primary">06:30</p>
                    </div>

                    <!-- 日落信息 -->
                    <div class="text-center">
                        <div class="text-5xl text-gray-600 mb-3">
                            <i class="fa fa-moon-o"></i>
                        </div>
                        <p class="text-lg font-semibold text-gray-700 mb-1">日落时间</p>
                        <p id="sunsetTime" class="text-2xl font-bold text-gray-600">18:30</p>
                    </div>
                </div>

                <!-- 查询时间与新查询按钮 -->
                <div class="mt-6 pt-6 border-t border-gray-100">
                    <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                        <div class="text-sm text-gray-500">
                            <i class="fa fa-clock-o mr-1"></i>
                            <span id="queryTime">查询于 10:00:00</span>
                        </div>
                        <button id="newQueryBtn"
                                class="text-primary hover:text-primary/80 font-medium transition-colors duration-300 flex items-center gap-1">
                            <i class="fa fa-refresh"></i>
                            <span>新查询</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 错误提示卡片 -->
            <div id="errorCard" class="hidden bg-white rounded-2xl p-6 md:p-8 card-shadow hover-lift">
                <div class="text-center py-6">
                    <div class="text-6xl text-red-500 mb-4">
                        <i class="fa fa-exclamation-circle"></i>
                    </div>
                    <h3 class="text-xl font-semibold mb-2 text-dark">查询失败</h3>
                    <p id="errorMessage" class="text-gray-600 mb-6">无法获取该城市的日出日落信息，请检查城市名称或网络连接后重试。</p>
                    <button id="retryBtn"
                            class="bg-primary hover:bg-primary/90 text-white font-medium py-2 px-6 rounded-lg transition-all duration-300 flex items-center justify-center gap-1">
                        <i class="fa fa-refresh"></i>
                        <span>重试</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-dark text-white py-6">
        <div class="container mx-auto px-4 text-center text-sm text-gray-400"></div>
    </footer>

    <script>
        // ************************** 核心配置 **************************
        const AMAP_GEO_KEY = "e59772d02dcf54682535ee0b28910c07";
        const OPENWEATHERMAP_KEY = "2a52256e07a6727fb4da6b871e805145";
        // **********************************************************************************

        // API基础地址
        const AMAP_GEO_URL = "https://restapi.amap.com/v3/geocode/geo"; // 高德地理编码API
        const OPENWEATHER_URL = "https://api.openweathermap.org/data/2.5/weather"; // OpenWeatherMap API

        // DOM元素获取
        const form = document.getElementById('sunriseForm');
        const resultContainer = document.getElementById('resultContainer');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const resultCard = document.getElementById('resultCard');
        const errorCard = document.getElementById('errorCard');
        const newQueryBtn = document.getElementById('newQueryBtn');
        const retryBtn = document.getElementById('retryBtn');

        // 结果显示元素
        const resultInfo = document.getElementById('resultInfo');
        const sunriseTime = document.getElementById('sunriseTime');
        const sunsetTime = document.getElementById('sunsetTime');
        const queryTime = document.getElementById('queryTime');
        const errorMessage = document.getElementById('errorMessage');

        /**
         * 1. 调用高德地图地理编码API，根据城市名称获取经纬度
         * @param {string} cityName - 输入的城市名称（如“北京”）
         * @returns {Promise<Object>} - 包含lat（纬度）、lon（经度）、formattedAddress（标准地址）的对象
         */
        async function getCityLatLon(cityName) {
            // 处理特殊字符（如城市名称含空格）
            const encodedCity = encodeURIComponent(cityName.trim());
            const requestUrl = `${AMAP_GEO_URL}?address=${encodedCity}&output=json&key=${AMAP_GEO_KEY}`;

            try {
                const response = await fetch(requestUrl);
                if (!response.ok) {
                    throw new Error(`高德API请求失败，状态码：${response.status}`);
                }

                const data = await response.json();
                // 高德API返回格式：status=1为成功，count为结果数量
                if (data.status !== "1" || data.count === "0" || !data.geocodes || data.geocodes.length === 0) {
                    throw new Error(`未找到“${cityName}”的地理信息，请检查城市名称是否正确`);
                }

                // 提取经纬度（高德返回格式："location": "116.481028,39.921983" → 经度在前，纬度在后）
                const location = data.geocodes[0].location.split(',');
                return {
                    lon: parseFloat(location[0]), // 经度
                    lat: parseFloat(location[1]), // 纬度
                    formattedAddress: data.geocodes[0].formatted_address // 标准地址（如“北京市北京市东城区”）
                };
            } catch (error) {
                console.error("地理编码失败：", error);
                throw error; // 抛出错误供上层处理
            }
        }

        /**
         * 2. 调用OpenWeatherMap API，根据经纬度和日期获取日出日落时间
         * @param {number} lat - 纬度
         * @param {number} lon - 经度
         * @param {Date} date - 查询日期
         * @returns {Promise<Object>} - 包含sunrise（日出时间HH:MM）、sunset（日落时间HH:MM）的对象
         */
        async function getSunTime(lat, lon, date) {
            // 转换日期为UTC时间戳（取当天中午12点，避免时区导致的日期偏差）
            const utcDate = new Date(date);
            utcDate.setUTCHours(12, 0, 0, 0); // 统一用UTC中午12点请求
            const dt = Math.floor(utcDate.getTime() / 1000); // 转换为秒级时间戳

            // 构建请求URL（添加units=metric确保返回公制单位，不影响时间）
            const requestUrl = `${OPENWEATHER_URL}?lat=${lat}&lon=${lon}&dt=${dt}&appid=${OPENWEATHERMAP_KEY}&units=metric`;

            try {
                const response = await fetch(requestUrl);
                if (!response.ok) {
                    const errorData = await response.json().catch(() => null);
                    const errorMsg = errorData?.message || `OpenWeatherAPI请求失败，状态码：${response.status}`;
                    throw new Error(errorMsg);
                }

                const data = await response.json();
                // 检查是否包含日出日落数据
                if (!data.sys || data.sys.sunrise === undefined || data.sys.sunset === undefined) {
                    throw new Error("未获取到日出日落数据，请尝试其他日期");
                }

                // 转换时间戳为本地时间（API返回的是UTC时间戳，需转为用户本地时区）
                const sunriseLocal = new Date(data.sys.sunrise * 1000);
                const sunsetLocal = new Date(data.sys.sunset * 1000);

                return {
                    sunrise: formatTime(sunriseLocal),
                    sunset: formatTime(sunsetLocal)
                };
            } catch (error) {
                console.error("日出时间获取失败：", error);
                throw error;
            }
        }

        /**
         * 辅助函数：格式化时间为HH:MM格式
         * @param {Date} date - 日期对象
         * @returns {string} - 格式化后的时间（如“06:30”“18:45”）
         */
        function formatTime(date) {
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            return `${hours}:${minutes}`;
        }

        /**
         * 辅助函数：格式化日期为“YYYY年MM月DD日”格式
         * @param {Date} date - 日期对象
         * @returns {string} - 格式化后的日期（如“2025年01月01日”）
         */
        function formatDate(date) {
            const year = date.getFullYear();
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const day = date.getDate().toString().padStart(2, '0');
            return `${year}年${month}月${day}日`;
        }

        /**
         * 显示查询成功结果
         * @param {string} cityName - 输入的城市名称
         * @param {string} formattedAddress - 标准地址（如“北京市北京市东城区”）
         * @param {Date} queryDate - 查询日期
         * @param {Object} sunTimes - 日出日落时间对象
         */
        function showSuccessResult(cityName, formattedAddress, queryDate, sunTimes) {
            // 填充结果信息
            resultInfo.textContent = `${formattedAddress} · ${formatDate(queryDate)}`;
            sunriseTime.textContent = sunTimes.sunrise;
            sunsetTime.textContent = sunTimes.sunset;

            // 显示当前查询时间（本地时间）
            const now = new Date();
            queryTime.textContent = `查询于 ${now.toLocaleTimeString()}`;

            // 切换显示状态
            loadingIndicator.classList.add('hidden');
            errorCard.classList.add('hidden');
            resultCard.classList.remove('hidden');
            resultCard.classList.add('animate-fadeIn');

            // 移除动画类（避免重复触发时动画异常）
            setTimeout(() => {
                resultCard.classList.remove('animate-fadeIn');
            }, 1000);
        }

        /**
         * 显示错误信息
         * @param {string} msg - 错误提示文本
         */
        function showError(msg) {
            errorMessage.textContent = msg;
            loadingIndicator.classList.add('hidden');
            resultCard.classList.add('hidden');
            errorCard.classList.remove('hidden');
        }

        /**
         * 表单提交核心逻辑
         */
        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // 阻止默认表单提交

            // 获取表单值
            const cityName = document.getElementById('cityInput').value.trim();
            const dateStr = document.getElementById('date').value;

            // 基础校验
            if (!cityName) {
                alert('请输入城市名称（如“北京”“上海”）');
                return;
            }
            if (!dateStr) {
                alert('请选择查询日期');
                return;
            }
            const queryDate = new Date(dateStr);

            // 显示加载状态
            resultContainer.classList.remove('hidden');
            resultCard.classList.add('hidden');
            errorCard.classList.add('hidden');
            loadingIndicator.classList.remove('hidden');

            try {
                // 1. 先检查API Key是否配置
                if (AMAP_GEO_KEY === "你的高德地图API Key" || !AMAP_GEO_KEY) {
                    throw new Error("请先在代码中配置你的高德地图地理编码API Key（从https://lbs.amap.com/申请）");
                }
                if (OPENWEATHERMAP_KEY === "你的OpenWeatherMap API Key" || !OPENWEATHERMAP_KEY) {
                    throw new Error("请先在代码中配置你的OpenWeatherMap API Key（从https://openweathermap.org/申请）");
                }

                // 2. 获取城市经纬度
                const cityGeo = await getCityLatLon(cityName);
                console.log("城市地理信息：", cityGeo);

                // 3. 获取日出日落时间
                const sunTimes = await getSunTime(cityGeo.lat, cityGeo.lon, queryDate);
                console.log("日出日落时间：", sunTimes);

                // 4. 显示成功结果
                showSuccessResult(cityName, cityGeo.formattedAddress, queryDate, sunTimes);

            } catch (error) {
                // 统一捕获所有环节的错误
                showError(error.message || "查询过程中出现未知错误，请稍后重试");
            }
        });

        /**
         * 新查询按钮逻辑：重置表单并滚动到表单位置
         */
        newQueryBtn.addEventListener('click', () => {
            resultContainer.classList.add('hidden');
            form.reset();
            // 平滑滚动到表单
            form.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });

        /**
         * 重试按钮逻辑：重新提交表单
         */
        retryBtn.addEventListener('click', () => {
            form.dispatchEvent(new Event('submit'));
        });

        /**
         * 页面加载完成后：设置默认日期为今天
         */
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            const formattedToday = today.toISOString().split('T')[0]; // 转为YYYY-MM-DD格式
            document.getElementById('date').value = formattedToday;
        });
    </script>
</body>
</html>
